[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-dictation"
version = "0.1.0"
description = "Fully local German push-to-talk dictation for KDE Plasma on Wayland"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "local-dictation contributors" }]
dependencies = [
  "PyQt6>=6.7",
  "evdev>=1.7",
  "pyudev>=0.24",
  "requests>=2.31",
]

[project.scripts]
local-dictation = "local_dictation.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_dictation = ["resources/*.wav", "resources/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires installed whisper-server and local models",
  "live: interacts with the active Wayland desktop and real input devices",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "E402",  # Standalone unittest modules add src/ before local imports.
  "UP042", # str+Enum preserves the public JSON/string API on Python 3.12.
]
