<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WhisperFlow Kurzanleitung</title>
  <desc id="desc">Rechte Strg-Taste halten, sprechen und die Taste loslassen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11182a"/><stop offset="1" stop-color="#0b201d"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a99ff"/><stop offset="1" stop-color="#56dcb6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <text x="70" y="92" fill="#f2f5ff" font-family="Segoe UI,Inter,sans-serif" font-size="44" font-weight="700">So diktierst du mit WhisperFlow</text>
  <text x="70" y="137" fill="#9aa8c0" font-family="Segoe UI,Inter,sans-serif" font-size="23">Drei Schritte · lokal auf deinem Gerät</text>
  <g filter="url(#shadow)">
    <rect x="65" y="205" width="320" height="430" rx="28" fill="#171e2b" stroke="#303b52"/>
    <rect x="440" y="205" width="320" height="430" rx="28" fill="#171e2b" stroke="#303b52"/>
    <rect x="815" y="205" width="320" height="430" rx="28" fill="#171e2b" stroke="#303b52"/>
  </g>
  <g font-family="Segoe UI,Inter,sans-serif">
    <circle cx="120" cy="260" r="28" fill="#7587ff"/><text x="120" y="269" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text>
    <rect x="126" y="326" width="198" height="116" rx="15" fill="#252f43" stroke="#6576a0"/><text x="225" y="397" text-anchor="middle" fill="#eef2ff" font-size="33" font-weight="700">Strg rechts</text>
    <path d="M225 470v55" stroke="url(#brand)" stroke-width="10" stroke-linecap="round"/><path d="m205 508 20 22 20-22" fill="none" stroke="#61d4bb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="225" y="578" text-anchor="middle" fill="#eef2ff" font-size="27" font-weight="650">Taste halten</text>

    <circle cx="495" cy="260" r="28" fill="#7587ff"/><text x="495" y="269" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text>
    <rect x="570" y="315" width="60" height="122" rx="30" fill="none" stroke="#7f91ff" stroke-width="10"/><path d="M535 397a65 65 0 0 0 130 0M600 462v46M566 510h68" fill="none" stroke="#61d4bb" stroke-width="10" stroke-linecap="round"/>
    <path d="M500 350c-18 25-18 64 0 89M700 350c18 25 18 64 0 89" fill="none" stroke="#46536f" stroke-width="8" stroke-linecap="round"/>
    <text x="600" y="578" text-anchor="middle" fill="#eef2ff" font-size="27" font-weight="650">Natürlich sprechen</text>

    <circle cx="870" cy="260" r="28" fill="#7587ff"/><text x="870" y="269" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text>
    <rect x="876" y="326" width="198" height="116" rx="15" fill="#252f43" stroke="#6576a0"/><text x="975" y="397" text-anchor="middle" fill="#eef2ff" font-size="33" font-weight="700">Strg rechts</text>
    <path d="M975 520v-55" stroke="url(#brand)" stroke-width="10" stroke-linecap="round"/><path d="m955 482 20-22 20 22" fill="none" stroke="#61d4bb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="975" y="578" text-anchor="middle" fill="#eef2ff" font-size="27" font-weight="650">Taste loslassen</text>
  </g>
  <path d="M390 420h43M765 420h43" stroke="#46536f" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
  <text x="600" y="700" text-anchor="middle" fill="#9aa8c0" font-family="Segoe UI,Inter,sans-serif" font-size="21">Der erkannte Text wird automatisch an der aktuellen Cursorposition eingefügt.</text>
</svg>
